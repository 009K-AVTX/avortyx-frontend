<!DOCTYPE html>

  <meta charset="utf-8">
  <!-- Google tag (gtag.js). The page view and every event queue in dataLayer right away; the
       library itself loads on a click or keypress, or once the page has been idle for a moment,
       so its ~0.4s of script never lands during start-up or a scroll. -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-HD8WHHFDQV');
    (function () {
      // loads only when the page is idle: never on a scroll (its ~0.4s of script would land
      // mid-scroll on a phone), only on a click or key, or once the visitor has stopped scrolling
      var done = false, quietAt = 0;
      function load() {
        if (done) return;
        done = true;
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-HD8WHHFDQV';
        document.head.appendChild(s);
      }
      addEventListener('scroll', function () { quietAt = Date.now() + 2000; }, { passive: true });
      ['click', 'keydown'].forEach(function (e) { addEventListener(e, load, { capture: true, once: true }); });
      // wait for 2s without scrolling, then for an idle moment, and check again right before loading
      function whenQuiet() {
        if (done) return;
        if (Date.now() < quietAt) { setTimeout(whenQuiet, 500); return; }
        if (!('requestIdleCallback' in window)) { load(); return; }
        requestIdleCallback(function () { if (Date.now() < quietAt) setTimeout(whenQuiet, 500); else load(); });
      }
      addEventListener('load', function () { setTimeout(whenQuiet, 3000); });
    })();
  </script>

  <meta name="color-scheme" content="dark">
  <script>
    // hold the page until the motion layer has built it, so the plain markup never flashes first
    document.documentElement.classList.add('avx-boot');
    (function () {
      // safety net: never keep the page hidden if the motion layer fails to run
      function lift() { document.documentElement.classList.remove('avx-boot'); }
      window.addEventListener('load', function () { setTimeout(lift, 1500); });
      setTimeout(lift, 3000);
    })();
  </script>
